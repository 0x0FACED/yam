<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_stack" name="shell-type">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
                background-color: #141316;
            }

            body {
                overscroll-behavior: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-error": "#690005", "on-tertiary": "#1f3700", "surface-container-low": "#1c1b1e", "surface-container-lowest": "#0f0e11", "surface-variant": "#363437", "inverse-surface": "#e6e1e5", "surface-container": "#201f22", "outline": "#948e9d", "surface-container-high": "#2b292d", "tertiary-fixed": "#acf847", "surface-container-highest": "#363437", "background": "#141316", "surface-dim": "#141316", "surface": "#141316", "on-background": "#e6e1e5", "on-secondary-container": "#4a1c00", "on-secondary": "#552100", "on-surface-variant": "#cac4d4", "on-primary-fixed-variant": "#4f319c", "primary-fixed": "#e8ddff", "primary-container": "#a78bfa", "tertiary-fixed-dim": "#91db2a", "primary": "#cebdff", "secondary-fixed": "#ffdbca", "primary-fixed-dim": "#cebdff", "inverse-on-surface": "#313033", "error-container": "#93000a", "secondary": "#ffb690", "on-tertiary-fixed": "#102000", "on-primary": "#381385", "on-primary-container": "#3c1989", "tertiary-container": "#6eae00", "on-error-container": "#ffdad6", "inverse-primary": "#674bb5", "secondary-container": "#ec6a06", "tertiary": "#91db2a", "on-secondary-fixed": "#341100", "on-tertiary-fixed-variant": "#304f00", "secondary-fixed-dim": "#ffb690", "on-secondary-fixed-variant": "#783200", "surface-bright": "#3a383c", "on-primary-fixed": "#21005e", "on-tertiary-container": "#223b00", "error": "#ffb4ab", "surface-tint": "#cebdff", "outline-variant": "#494552", "on-surface": "#e6e1e5" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "0.75rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-xl": "1.5rem", "space-md": "0.75rem", "space-lg": "1rem" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-lg-mobile": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased">
    <main class="flex-1 flex flex-col relative w-full pb-safe bg-surface pt-safe">
        <div class="flex flex-col w-full px-margin pb-space-xl">
            <div class="flex items-center justify-between py-space-sm pt-space-md"><button aria-label="Назад к шагу 2"
                    class="w-10 h-10 -ml-space-xs flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors rounded-full bg-surface-container-low"
                    onclick="history.back()" type="button"><span
                        class="material-symbols-outlined text-[20px]">arrow_back</span></button>
                <div class="flex items-center gap-space-xs bg-surface-container px-space-md py-space-xs rounded-full">
                    <span
                        class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Шаг</span><span
                        class="font-label-md text-label-md text-primary font-semibold">3 из 3</span></div>
            </div>
            <div aria-valuemax="3" aria-valuemin="1" aria-valuenow="3"
                class="grid grid-cols-3 gap-space-xs mt-space-xs mb-space-lg" role="progressbar">
                <div class="h-1.5 rounded-full bg-primary-container"></div>
                <div class="h-1.5 rounded-full bg-primary-container"></div>
                <div class="h-1.5 rounded-full bg-primary-container"></div>
            </div>
            <div class="flex flex-col gap-space-xs mb-space-lg">
                <h1 class="font-headline-md text-headline-md text-on-surface">Цели питания</h1>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Задайте базовые суточные ориентиры под ваш
                    режим</p>
            </div>
            <div class="flex flex-col gap-space-lg">
                <div class="flex flex-col gap-space-xs"><label
                        class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider"
                        for="calories-input">Калории в день</label>
                    <div
                        class="flex items-center justify-between bg-surface-container-low rounded-lg px-space-md py-space-sm">
                        <input aria-label="Суточная норма калорий"
                            class="bg-transparent font-headline-md text-headline-md text-on-surface w-full focus:outline-none tracking-tight"
                            id="calories-input" inputmode="numeric" type="number" value="1950"><span
                            class="font-label-lg text-label-lg text-on-surface-variant ml-space-sm select-none">ккал</span>
                    </div>
                </div>
                <div class="flex flex-col gap-space-xs"><label
                        class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Макронутриенты</label>
                    <div class="grid grid-cols-3 gap-space-sm">
                        <div>
                            <div class="flex items-center gap-1.5 mb-space-xs"><span
                                    class="w-2 h-2 rounded-full inline-block"
                                    style="background-color: #fb923c;"></span><span
                                    class="font-label-sm text-label-sm text-on-surface-variant truncate">Белки</span>
                            </div>
                            <div
                                class="flex items-center justify-between bg-surface-container-low rounded-lg px-space-sm py-space-xs">
                                <input aria-label="Белки в граммах"
                                    class="bg-transparent font-headline-sm text-headline-sm text-on-surface w-full text-center focus:outline-none"
                                    inputmode="numeric" type="number" value="140"><span
                                    class="font-label-sm text-label-sm text-on-surface-variant pr-space-xs select-none">г</span>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 mb-space-xs"><span
                                    class="w-2 h-2 rounded-full inline-block"
                                    style="background-color: #a3e635;"></span><span
                                    class="font-label-sm text-label-sm text-on-surface-variant truncate">Жиры</span>
                            </div>
                            <div
                                class="flex items-center justify-between bg-surface-container-low rounded-lg px-space-sm py-space-xs">
                                <input aria-label="Жиры в граммах"
                                    class="bg-transparent font-headline-sm text-headline-sm text-on-surface w-full text-center focus:outline-none"
                                    inputmode="numeric" type="number" value="65"><span
                                    class="font-label-sm text-label-sm text-on-surface-variant pr-space-xs select-none">г</span>
                            </div>
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5 mb-space-xs"><span
                                    class="w-2 h-2 rounded-full inline-block"
                                    style="background-color: #38bdf8;"></span><span
                                    class="font-label-sm text-label-sm text-on-surface-variant truncate">Углеводы</span>
                            </div>
                            <div
                                class="flex items-center justify-between bg-surface-container-low rounded-lg px-space-sm py-space-xs">
                                <input aria-label="Углеводы в граммах"
                                    class="bg-transparent font-headline-sm text-headline-sm text-on-surface w-full text-center focus:outline-none"
                                    inputmode="numeric" type="number" value="210"><span
                                    class="font-label-sm text-label-sm text-on-surface-variant pr-space-xs select-none">г</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-space-xs px-space-xs"><span
                        class="material-symbols-outlined text-outline text-[16px]">info</span>
                    <p class="font-body-sm text-body-sm text-outline">Эти значения можно изменить позже в настройках.
                    </p>
                </div>
            </div>
            <div class="mt-space-xl pt-space-lg"><button
                    class="w-full h-12 bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-lg shadow-sm flex items-center justify-center transition-transform active:scale-[0.99]"
                    type="button">Начать</button></div>
        </div>
    </main>

</body>

</html>
