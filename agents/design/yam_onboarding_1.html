<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_blank" name="shell-type">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
                background-color: #141316;
            }

            body {
                overscroll-behavior: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-error": "#690005", "on-tertiary": "#1f3700", "surface-container-low": "#1c1b1e", "surface-container-lowest": "#0f0e11", "surface-variant": "#363437", "inverse-surface": "#e6e1e5", "surface-container": "#201f22", "outline": "#948e9d", "surface-container-high": "#2b292d", "tertiary-fixed": "#acf847", "surface-container-highest": "#363437", "background": "#141316", "surface-dim": "#141316", "surface": "#141316", "on-background": "#e6e1e5", "on-secondary-container": "#4a1c00", "on-secondary": "#552100", "on-surface-variant": "#cac4d4", "on-primary-fixed-variant": "#4f319c", "primary-fixed": "#e8ddff", "primary-container": "#a78bfa", "tertiary-fixed-dim": "#91db2a", "primary": "#cebdff", "secondary-fixed": "#ffdbca", "primary-fixed-dim": "#cebdff", "inverse-on-surface": "#313033", "error-container": "#93000a", "secondary": "#ffb690", "on-tertiary-fixed": "#102000", "on-primary": "#381385", "on-primary-container": "#3c1989", "tertiary-container": "#6eae00", "on-error-container": "#ffdad6", "inverse-primary": "#674bb5", "secondary-container": "#ec6a06", "tertiary": "#91db2a", "on-secondary-fixed": "#341100", "on-tertiary-fixed-variant": "#304f00", "secondary-fixed-dim": "#ffb690", "on-secondary-fixed-variant": "#783200", "surface-bright": "#3a383c", "on-primary-fixed": "#21005e", "on-tertiary-container": "#223b00", "error": "#ffb4ab", "surface-tint": "#cebdff", "outline-variant": "#494552", "on-surface": "#e6e1e5" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "0.75rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-xl": "1.5rem", "space-md": "0.75rem", "space-lg": "1rem" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-lg-mobile": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased">
    <main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface">
        <div class="flex flex-col w-full px-margin pb-space-xl">
            <!-- Progress Header -->
            <div class="flex flex-col gap-space-sm pt-space-md mb-space-xl">
                <div class="flex items-center justify-between">
                    <span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Шаг 1 из 3</span>
                    <span class="font-label-sm text-label-sm text-primary">Цель</span>
                </div>
                <div class="flex items-center gap-space-xs w-full">
                    <div class="h-1 flex-1 rounded-full bg-primary-container"></div>
                    <div class="h-1 flex-1 rounded-full bg-surface-container-high"></div>
                    <div class="h-1 flex-1 rounded-full bg-surface-container-high"></div>
                </div>
            </div>
            <!-- Screen Header -->
            <div class="flex flex-col mb-space-xl">
                <h1 class="font-headline-md text-headline-md text-on-surface">Что хочешь изменить?</h1>
                <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Это определит баланс калорий и
                    макронутриентов на каждый день</p>
            </div>
            <!-- Selectable Options List -->
            <form class="flex flex-col gap-space-md" id="goalForm" onsubmit="event.preventDefault();">
                <!-- Option 1: Снизить вес (Active by default) -->
                <label
                    class="group relative flex items-center justify-between p-space-lg rounded-xl cursor-pointer transition-all duration-150 select-none bg-surface-container-high"
                    data-option="lose">
                    <input checked="" class="sr-only" name="nutrition_goal" onchange="updateSelection(this)"
                        type="radio" value="lose">
                    <div class="flex items-center gap-space-md min-w-0">
                        <div
                            class="w-10 h-10 rounded-lg flex items-center justify-center bg-primary-container text-on-primary-container transition-colors">
                            <span class="material-symbols-outlined text-[20px]">trending_down</span>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="font-label-lg text-label-lg text-on-surface font-semibold">Снизить вес</span>
                            <span class="font-body-sm text-body-sm text-on-surface-variant truncate">Для постепенного
                                снижения веса</span>
                        </div>
                    </div>
                    <div
                        class="indicator flex items-center justify-center w-6 h-6 rounded-full bg-primary-container text-on-primary">
                        <span class="material-symbols-outlined text-[16px] font-bold">check</span>
                    </div>
                </label>
                <!-- Option 2: Поддерживать вес -->
                <label
                    class="group relative flex items-center justify-between p-space-lg rounded-xl cursor-pointer transition-all duration-150 select-none bg-surface-container-low"
                    data-option="maintain">
                    <input class="sr-only" name="nutrition_goal" onchange="updateSelection(this)" type="radio"
                        value="maintain">
                    <div class="flex items-center gap-space-md min-w-0">
                        <div
                            class="w-10 h-10 rounded-lg flex items-center justify-center bg-surface-container text-outline transition-colors">
                            <span class="material-symbols-outlined text-[20px]">balance</span>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="font-label-lg text-label-lg text-on-surface font-semibold">Поддерживать
                                вес</span>
                            <span class="font-body-sm text-body-sm text-on-surface-variant truncate">Чтобы сохранять
                                текущий вес</span>
                        </div>
                    </div>
                    <div
                        class="indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent">
                        <span class="material-symbols-outlined text-[16px]">check</span>
                    </div>
                </label>
                <!-- Option 3: Набрать вес -->
                <label
                    class="group relative flex items-center justify-between p-space-lg rounded-xl cursor-pointer transition-all duration-150 select-none bg-surface-container-low"
                    data-option="gain">
                    <input class="sr-only" name="nutrition_goal" onchange="updateSelection(this)" type="radio"
                        value="gain">
                    <div class="flex items-center gap-space-md min-w-0">
                        <div
                            class="w-10 h-10 rounded-lg flex items-center justify-center bg-surface-container text-outline transition-colors">
                            <span class="material-symbols-outlined text-[20px]">trending_up</span>
                        </div>
                        <div class="flex flex-col min-w-0">
                            <span class="font-label-lg text-label-lg text-on-surface font-semibold">Набрать вес</span>
                            <span class="font-body-sm text-body-sm text-on-surface-variant truncate">Для постепенного
                                набора веса</span>
                        </div>
                    </div>
                    <div
                        class="indicator flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-highest text-transparent">
                        <span class="material-symbols-outlined text-[16px]">check</span>
                    </div>
                </label>
            </form>
            <!-- Bottom CTA Container -->
            <div class="pt-space-xl mt-auto">
                <button
                    class="w-full h-12 flex items-center justify-center gap-space-sm bg-primary-container text-on-primary-container rounded-lg font-label-lg text-label-lg font-semibold active:opacity-90 transition-opacity"
                    id="continueBtn" type="button">
                    <span class="">Продолжить</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </div>
        </div>
        <script>
            function updateSelection(input) {
                const labels = document.querySelectorAll('#goalForm label');
                labels.forEach(label => {
                    const radio = label.querySelector('input[type="radio"]');
                    const iconWrap = label.querySelector('div.w-10');
                    const indicator = label.querySelector('.indicator');

                    if (radio.checked) {
                        label.classList.remove('bg-surface-container-low');
                        label.classList.add('bg-surface-container-high');

                        iconWrap.classList.remove('bg-surface-container', 'text-outline');
                        iconWrap.classList.add('bg-primary-container', 'text-on-primary-container');

                        indicator.classList.remove('bg-surface-container-highest', 'text-transparent');
                        indicator.classList.add('bg-primary-container', 'text-on-primary');
                    } else {
                        label.classList.remove('bg-surface-container-high');
                        label.classList.add('bg-surface-container-low');

                        iconWrap.classList.remove('bg-primary-container', 'text-on-primary-container');
                        iconWrap.classList.add('bg-surface-container', 'text-outline');

                        indicator.classList.remove('bg-primary-container', 'text-on-primary');
                        indicator.classList.add('bg-surface-container-highest', 'text-transparent');
                    }
                });
            }
        </script>
    </main>

</body>

</html>
