<!DOCTYPE html>

    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;

<body
    class="bg-surface font-body-md text-body-md text-on-surface flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="h-14 px-margin flex items-center justify-between">

    </header>

                            У 210</span>
                    </div>

                </button>
                <div class="h-[1px] bg-surface-container-high mx-4"></div>

            </div>

            </div>
            <div class="rounded-xl bg-surface-container-low overflow-hidden shadow-sm">
                <button
                    class="w-full flex items-center justify-between min-h-[52px] px-4 text-left active:bg-surface-container transition-colors"
                    type="button">
                    <span class="font-label-lg text-label-lg text-on-surface font-medium">Тема</span>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="font-body-md text-body-md text-outline">Системная</span>
                        <span class="material-symbols-outlined text-outline text-[20px]">chevron_right</span>
                    </div>
                </button>
                <div class="h-[1px] bg-surface-container-high mx-4"></div>
                <button
                    class="w-full flex items-center justify-between min-h-[52px] px-4 text-left active:bg-surface-container transition-colors"

                    <span class="font-label-lg text-label-lg text-on-surface font-medium">Единицы измерения</span>
                    <div class="flex items-center gap-1.5 shrink-0">

                        <span class="material-symbols-outlined text-outline text-[20px]">chevron_right</span>
                    </div>
                </button>

                    type="button">
                    <span class="font-label-lg text-label-lg text-on-surface font-medium">Язык</span>
                    <div class="flex items-center gap-1.5 shrink-0">

                        <span class="material-symbols-outlined text-outline text-[20px]">chevron_right</span>
                    </div>
                </button>
            </div>
            <div class="pt-6 pb-2">

                    type="button">
                    <span class="font-label-lg text-label-lg text-on-surface font-medium">Экспорт данных</span>
                    <span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>

                <div class="h-[1px] bg-surface-container-high mx-4"></div>
                <button
                    class="w-full flex items-center justify-between min-h-[52px] px-4 text-left active:bg-surface-container transition-colors"
                    type="button">
                    <span class="font-label-lg text-label-lg text-error font-medium">Удалить все данные</span>
                    <span class="material-symbols-outlined text-error/60 text-[20px] shrink-0">chevron_right</span>

            </div>

                    type="button">
                    <span class="font-label-lg text-label-lg text-on-surface font-medium">О YAM</span>
                    <span class="material-symbols-outlined text-outline text-[20px] shrink-0">chevron_right</span>
