<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_stack" name="shell-type">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
                background-color: #141316;
            }

            body {
                overscroll-behavior: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-error": "#690005", "on-tertiary": "#1f3700", "surface-container-low": "#1c1b1e", "surface-container-lowest": "#0f0e11", "surface-variant": "#363437", "inverse-surface": "#e6e1e5", "surface-container": "#201f22", "outline": "#948e9d", "surface-container-high": "#2b292d", "tertiary-fixed": "#acf847", "surface-container-highest": "#363437", "background": "#141316", "surface-dim": "#141316", "surface": "#141316", "on-background": "#e6e1e5", "on-secondary-container": "#4a1c00", "on-secondary": "#552100", "on-surface-variant": "#cac4d4", "on-primary-fixed-variant": "#4f319c", "primary-fixed": "#e8ddff", "primary-container": "#a78bfa", "tertiary-fixed-dim": "#91db2a", "primary": "#cebdff", "secondary-fixed": "#ffdbca", "primary-fixed-dim": "#cebdff", "inverse-on-surface": "#313033", "error-container": "#93000a", "secondary": "#ffb690", "on-tertiary-fixed": "#102000", "on-primary": "#381385", "on-primary-container": "#3c1989", "tertiary-container": "#6eae00", "on-error-container": "#ffdad6", "inverse-primary": "#674bb5", "secondary-container": "#ec6a06", "tertiary": "#91db2a", "on-secondary-fixed": "#341100", "on-tertiary-fixed-variant": "#304f00", "secondary-fixed-dim": "#ffb690", "on-secondary-fixed-variant": "#783200", "surface-bright": "#3a383c", "on-primary-fixed": "#21005e", "on-tertiary-container": "#223b00", "error": "#ffb4ab", "surface-tint": "#cebdff", "outline-variant": "#494552", "on-surface": "#e6e1e5" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "0.75rem", "space-sm": "0.5rem", "margin": "1rem", "space-xs": "0.25rem", "space-xl": "1.5rem", "space-md": "0.75rem", "space-lg": "1rem" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "headline-lg-mobile": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col antialiased">
    <main class="flex-1 flex flex-col relative w-full pb-safe bg-surface pt-safe">
        <div class="flex flex-col w-full px-margin pb-space-lg">
            <!-- Progress Header Context (2 of 3) -->
            <div class="flex flex-col gap-space-sm pt-space-md mb-space-xl">
                <div class="flex items-center justify-between mb-space-xs"><button aria-label="Go Back"
                        class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors rounded-full"
                        onclick="history.back()" type="button"><span
                            class="material-symbols-outlined text-[20px]">arrow_back</span></button><span
                        class="font-label-md text-label-md text-primary">Цель по весу</span></div>
                <div class="flex items-center justify-between"><span
                        class="font-label-sm text-label-sm uppercase tracking-wider text-outline">Шаг 2 из 3</span>
                </div>
                <div class="grid grid-cols-3 gap-space-xs w-full mt-space-xs">
                    <div class="h-1 rounded-full bg-primary"></div>
                    <div class="h-1 rounded-full bg-primary"></div>
                    <div class="h-1 rounded-full bg-surface-container-highest"></div>
                </div>
            </div>
            <!-- Title & Delightful Micro-prompt -->
            <div class="flex flex-col mb-space-xl">
                <div class="flex items-center gap-space-xs">
                    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Вес</h1>

                </div>
                <p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
                    Укажи текущий и желаемый вес
                </p>
            </div>
            <!-- Inputs Group (Canonical YamNumberField pattern) -->
            <form class="flex flex-col gap-space-md" id="weight-form" onsubmit="event.preventDefault();">
                <!-- Field 1: Current Weight -->
                <div
                    class="bg-surface-container-low rounded-xl p-space-md transition-all duration-200 focus-within:bg-surface-container focus-within:shadow-md">
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-space-xs"
                        for="current-weight">
                        Текущий вес
                    </label>
                    <div class="flex items-center justify-between">
                        <div class="flex items-baseline gap-space-xs flex-1">
                            <input aria-label="Текущий вес в килограммах"
                                class="bg-transparent font-headline-md text-headline-md text-on-surface font-semibold focus:outline-none w-full appearance-none m-0 p-0 selection:bg-primary-container selection:text-on-primary-container"
                                id="current-weight" inputmode="decimal" max="300" min="30" name="currentWeight"
                                step="0.1" type="number" value="74.2">
                        </div>
                        <span class="font-label-lg text-label-lg text-outline select-none pl-space-sm">кг</span>
                    </div>
                </div>
                <!-- Field 2: Target Weight -->
                <div
                    class="bg-surface-container-low rounded-xl p-space-md transition-all duration-200 focus-within:bg-surface-container focus-within:shadow-md">
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-space-xs"
                        for="target-weight">
                        Целевой вес
                    </label>
                    <div class="flex items-center justify-between">
                        <div class="flex items-baseline gap-space-xs flex-1">
                            <input aria-label="Целевой вес в килограммах"
                                class="bg-transparent font-headline-md text-headline-md text-on-surface font-semibold focus:outline-none w-full appearance-none m-0 p-0 selection:bg-primary-container selection:text-on-primary-container"
                                id="target-weight" inputmode="decimal" max="300" min="30" name="targetWeight" step="0.1"
                                type="number" value="72.0">
                        </div>
                        <span class="font-label-lg text-label-lg text-outline select-none pl-space-sm">кг</span>
                    </div>
                </div>
                <!-- Tactile Difference Micro-Indicator (Dynamic Human Feedback) -->
                <div class="flex items-center justify-between px-space-xs py-space-xs" id="diff-container"><span
                        class="font-body-sm text-body-sm text-on-surface-variant">Разница до цели</span><span
                        class="font-body-sm text-body-sm text-outline" id="weight-delta">-2.2 кг</span></div>
            </form>
            <!-- Sticky-feel Bottom Action Bar -->
            <div class="mt-space-xl pt-space-lg flex flex-col gap-space-sm">
                <button
                    class="w-full h-12 bg-primary-container text-on-secondary-container hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-space-xs rounded-lg shadow-sm font-label-lg text-label-lg"
                    id="submit-step" type="button">
                    <span class="">Продолжить</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </div>
        </div>
        <script>
            (() => {
                const currentInput = document.getElementById('current-weight');
                const targetInput = document.getElementById('target-weight');
                const deltaBadge = document.getElementById('weight-delta');

                function updateDifference() {
                    const current = parseFloat(currentInput.value) || 0;
                    const target = parseFloat(targetInput.value) || 0;
                    const diff = +(target - current).toFixed(1);

                    if (diff === 0) {
                        deltaBadge.textContent = 'Удержание текущего веса';
                        deltaBadge.className = 'font-label-md text-label-md text-outline';
                    } else if (diff < 0) {
                        deltaBadge.textContent = `${diff} кг`;
                        deltaBadge.className = 'font-label-md text-label-md text-tertiary';
                    } else {
                        deltaBadge.textContent = `+${diff} кг`;
                        deltaBadge.className = 'font-label-md text-label-md text-secondary';
                    }
                }

                currentInput.addEventListener('input', updateDifference);
                targetInput.addEventListener('input', updateDifference);
                updateDifference();
            })();
        </script>
    </main>

</body>

</html>
