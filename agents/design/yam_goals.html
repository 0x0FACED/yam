<!DOCTYPE html>
<html class="dark" lang="ru">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
    <meta content="mobile_stack" name="shell-type">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script
        id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#102000", "surface": "#141316", "tertiary": "#91db2a", "on-primary-fixed-variant": "#4f319c", "surface-container-highest": "#363437", "primary-fixed-dim": "#cebdff", "secondary-fixed": "#ffdbca", "primary": "#cebdff", "tertiary-fixed-dim": "#91db2a", "primary-fixed": "#e8ddff", "surface-bright": "#3a383c", "on-surface": "#e6e1e5", "on-secondary-fixed": "#341100", "on-tertiary-container": "#223b00", "on-primary-fixed": "#21005e", "on-secondary-container": "#4a1c00", "inverse-primary": "#674bb5", "background": "#141316", "tertiary-fixed": "#acf847", "outline": "#948e9d", "inverse-surface": "#e6e1e5", "on-secondary-fixed-variant": "#783200", "surface-container": "#201f22", "on-background": "#e6e1e5", "inverse-on-surface": "#313033", "primary-container": "#a78bfa", "surface-container-high": "#2b292d", "surface-variant": "#363437", "surface-container-low": "#1c1b1e", "surface-dim": "#141316", "on-primary": "#381385", "on-error": "#690005", "on-tertiary-fixed-variant": "#304f00", "tertiary-container": "#6eae00", "secondary": "#ffb690", "on-tertiary": "#1f3700", "outline-variant": "#494552", "on-secondary": "#552100", "surface-tint": "#cebdff", "on-primary-container": "#3c1989", "on-error-container": "#ffdad6", "surface-container-lowest": "#0f0e11", "on-surface-variant": "#cac4d4", "error": "#ffb4ab", "error-container": "#93000a", "secondary-fixed-dim": "#ffb690", "secondary-container": "#ec6a06" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-md": "0.75rem", "margin": "1rem", "space-lg": "1rem", "gutter": "0.75rem", "space-xs": "0.25rem", "space-xl": "1.5rem" }, "fontFamily": { "label-md": ["Inter"], "body-lg": ["Inter"], "label-lg": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "headline-lg-mobile": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"] }, "fontSize": { "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }] } } } }</script>
    <style>
        @layer base {

            html,
            body {
                width: 100vw;
                margin: 0;
                padding: 0;
            }

            body {
                overscroll-behavior: none;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-surface text-on-surface flex flex-col min-h-screen">
    <header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
        <div class="h-14 px-margin flex items-center justify-between">
            <div class="flex items-center gap-space-xs"><button aria-label="Назад"
                    class="w-11 h-11 -ml-space-xs rounded-xl flex items-center justify-center text-on-surface hover:bg-surface-container transition-colors"
                    onclick="history.back()" type="button"><span
                        class="material-symbols-outlined text-[24px]">arrow_back</span></button>
                <h1 class="font-headline-sm text-headline-sm text-on-surface select-none truncate">Цели</h1>
            </div>
        </div>
    </header>
    <main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface">
        <div class="flex flex-col w-full px-margin pb-space-xl">
            <form class="flex flex-col w-full" id="goals-form" onsubmit="event.preventDefault();">
                <div class="flex flex-col w-full mt-space-md">
                    <div class="flex items-center justify-between mb-space-sm px-space-xs">
                        <span class="font-label-sm text-label-sm tracking-wider uppercase text-outline">Питание</span>
                    </div>
                    <div class="flex flex-col gap-space-md">
                        <div class="flex flex-col">
                            <label class="font-label-md text-label-md text-on-surface-variant mb-space-xs px-space-xs"
                                for="calories-goal">
                                Калории в день
                            </label>
                            <div
                                class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                <input
                                    class="w-full bg-transparent px-space-md py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-14 select-all"
                                    id="calories-goal" inputmode="numeric" type="number" value="1950">
                                <span
                                    class="absolute right-space-md font-body-md text-body-md text-outline pointer-events-none select-none">
                                    ккал
                                </span>
                            </div>
                        </div>
                        <div class="grid grid-cols-3 gap-space-sm w-full">
                            <div class="flex flex-col min-w-0">
                                <label
                                    class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant mb-space-xs px-space-xs truncate"
                                    for="protein-goal">
                                    <span class="w-1.5 h-1.5 rounded-full bg-secondary flex-shrink-0"
                                        style="background-color: rgb(251, 146, 60);"></span>
                                    <span class="truncate">Белки</span>
                                </label>
                                <div
                                    class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                    <input
                                        class="w-full bg-transparent px-space-sm py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-6 text-center select-all"
                                        id="protein-goal" inputmode="numeric" type="number" value="140">
                                    <span
                                        class="absolute right-space-sm font-body-md text-body-md text-outline pointer-events-none select-none">
                                        г
                                    </span>
                                </div>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <label
                                    class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant mb-space-xs px-space-xs truncate"
                                    for="fat-goal">
                                    <span class="w-1.5 h-1.5 rounded-full bg-tertiary flex-shrink-0"
                                        style="background-color: rgb(163, 230, 53);"></span>
                                    <span class="truncate">Жиры</span>
                                </label>
                                <div
                                    class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                    <input
                                        class="w-full bg-transparent px-space-sm py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-6 text-center select-all"
                                        id="fat-goal" inputmode="numeric" type="number" value="65">
                                    <span
                                        class="absolute right-space-sm font-body-md text-body-md text-outline pointer-events-none select-none">
                                        г
                                    </span>
                                </div>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <label
                                    class="flex items-center gap-1 font-label-sm text-label-sm text-on-surface-variant mb-space-xs px-space-xs truncate"
                                    for="carbs-goal">
                                    <span class="w-1.5 h-1.5 rounded-full bg-primary flex-shrink-0"
                                        style="background-color: rgb(56, 189, 248);"></span>
                                    <span class="truncate">Углеводы</span>
                                </label>
                                <div
                                    class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                    <input
                                        class="w-full bg-transparent px-space-sm py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-6 text-center select-all"
                                        id="carbs-goal" inputmode="numeric" type="number" value="210">
                                    <span
                                        class="absolute right-space-sm font-body-md text-body-md text-outline pointer-events-none select-none">
                                        г
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col w-full mt-space-xl">
                    <div class="flex items-center justify-between mb-space-sm px-space-xs">
                        <span class="font-label-sm text-label-sm tracking-wider uppercase text-outline">Вес</span>
                    </div>
                    <div class="flex flex-col gap-space-md">
                        <div class="flex flex-col">
                            <label class="font-label-md text-label-md text-on-surface-variant mb-space-xs px-space-xs"
                                for="current-weight">
                                Текущий вес
                            </label>
                            <div
                                class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                <input
                                    class="w-full bg-transparent px-space-md py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-12 select-all"
                                    id="current-weight" inputmode="decimal" type="text" value="74,2">
                                <span
                                    class="absolute right-space-md font-body-md text-body-md text-outline pointer-events-none select-none">
                                    кг
                                </span>
                            </div>
                        </div>
                        <div class="flex flex-col">
                            <label class="font-label-md text-label-md text-on-surface-variant mb-space-xs px-space-xs"
                                for="target-weight">
                                Целевой вес
                            </label>
                            <div
                                class="relative flex items-center bg-surface-container-low rounded-lg transition-colors focus-within:bg-surface-container">
                                <input
                                    class="w-full bg-transparent px-space-md py-2.5 font-body-lg text-body-lg text-on-surface outline-none pr-12 select-all"
                                    id="target-weight" inputmode="decimal" type="text" value="72,0">
                                <span
                                    class="absolute right-space-md font-body-md text-body-md text-outline pointer-events-none select-none">
                                    кг
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-space-xl pt-space-lg flex flex-col w-full">
                    <button
                        class="w-full py-3.5 bg-primary-container text-on-primary-fixed rounded-xl font-label-lg text-label-lg active:opacity-90 active:scale-[0.99] transition-all flex items-center justify-center select-none"
                        id="save-goals-btn" type="button">
                        Сохранить
                    </button>
                    <div class="h-4 mt-space-xs flex items-center justify-center opacity-0 transition-opacity"
                        id="save-feedback">
                        <span class="font-label-sm text-label-sm text-tertiary">Изменения сохранены</span>
                    </div>
                </div>
            </form>
        </div>
        <script>
                (function () {
                    const saveBtn = document.getElementById('save-goals-btn');
                    const feedback = document.getElementById('save-feedback');

                    if (saveBtn && feedback) {
                        saveBtn.addEventListener('click', () => {
                            feedback.classList.remove('opacity-0');
                            feedback.classList.add('opacity-100');

                            setTimeout(() => {
                                feedback.classList.remove('opacity-100');
                                feedback.classList.add('opacity-0');
                            }, 1800);
                        });
                    }
                })();
        </script>
    </main>

</body>

</html>
