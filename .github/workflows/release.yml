name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never interrupt an in-flight publication for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      artifact_version: ${{ steps.metadata.outputs.artifact_version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Require persistent Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Required signing secret %s is not configured\n' "$name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter project
        uses: ./.github/actions/setup-flutter
      - name: Resolve and validate tag version
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: dart run tool/release_metadata.dart --tag "$TAG" --build-number "$GITHUB_RUN_NUMBER" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Upload validated release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 14

  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  android:
    name: Signed Android APK
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK's Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Set up Flutter project
        uses: ./.github/actions/setup-flutter
      - name: Build with the persistent release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/yam-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --no-pub --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/yam-${ARTIFACT_VERSION}-android.apk"
      - name: Remove temporary release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/yam-release.jks"
      - name: Upload Android package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux x64 bundle
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Install Java 17 for native JNI dependencies
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter project
        uses: ./.github/actions/setup-flutter
      - name: Build and archive the entire bundle
        run: |
          flutter build linux --release --no-pub --target-platform linux-x64 --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          test -x build/linux/x64/release/bundle/yam
          test -f build/linux/x64/release/bundle/lib/libflutter_linux_gtk.so
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("build/linux/x64/release/bundle/data/flutter_assets/version.json").read_text())
          if metadata["version"] != os.environ["VERSION"] or metadata["build_number"] != os.environ["BUILD_NUMBER"]:
              raise SystemExit("Linux package metadata does not match the release version.")
          PY
          mkdir -p dist
          tar -czf "dist/yam-${ARTIFACT_VERSION}-linux-x64.tar.gz" -C build/linux/x64/release bundle
      - name: Upload Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    name: Ad-hoc signed macOS universal app
    needs: [prepare, ci]
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
      # Flutter 3.38.5 forwards FLUTTER_XCODE_* to xcodebuild. Its macOS
      # command has neither --target-platform nor --no-codesign flags.
      FLUTTER_XCODE_ARCHS: 'x86_64 arm64'
      FLUTTER_XCODE_ONLY_ACTIVE_ARCH: 'NO'
      FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
      FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter project
        uses: ./.github/actions/setup-flutter
      - name: Build universal app without Apple credentials
        run: flutter build macos --release --no-pub --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Verify universal binaries and archive app
        run: |
          app=build/macos/Build/Products/Release/YAM.app
          test -x "$app/Contents/MacOS/YAM"
          # Fail rather than label a thin executable or bundled dylib universal.
          while IFS= read -r -d '' binary; do
            description="$(file -b "$binary")"
            if [[ "$description" == *Mach-O* ]]; then
              lipo "$binary" -verify_arch x86_64 arm64
            fi
          done < <(find "$app" -type f -print0)
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          # ditto retains framework symlinks, executable permissions and bundle metadata.
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/yam-${ARTIFACT_VERSION}-macos-universal.zip"
      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete GitHub Release
    needs: [prepare, android, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Download Android package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: dist
      - name: Download Linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x64
          path: dist
      - name: Download macOS package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-universal
          path: dist
      - name: Check packages and compute SHA256SUMS
        working-directory: dist
        run: |
          files=(
            "yam-${ARTIFACT_VERSION}-android.apk"
            "yam-${ARTIFACT_VERSION}-linux-x64.tar.gz"
            "yam-${ARTIFACT_VERSION}-macos-universal.zip"
          )
          for package in "${files[@]}"; do
            test -s "$package"
          done
          sha256sum "${files[@]}" > SHA256SUMS
      - name: Create draft, upload all assets, then publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes/release-notes.md"
          test -s "$notes"
          printf '\n\n---\n\n' >> "$notes"
          cat >> "$notes" <<'NOTES'
          Packages:
          - Android: APK signed with the project's persistent release key.
          - Linux x64: complete Flutter bundle; extract and run bundle/yam. Requires a compatible Linux system with GTK 3; built on Ubuntu 24.04, not a portable AppImage.
          - macOS universal (Intel and Apple Silicon): YAM.app in a permission- and symlink-preserving zip. Ad-hoc signed only, NOT Apple Developer ID signed or notarized. Gatekeeper may block the downloaded app; no notarized DMG is provided.

          SHA256SUMS covers the three downloadable packages.
          NOTES
          gh release create "$TAG" --verify-tag --title "YAM $ARTIFACT_VERSION" --draft --notes-file "$notes"
          gh release upload "$TAG" \
            "yam-${ARTIFACT_VERSION}-android.apk" \
            "yam-${ARTIFACT_VERSION}-linux-x64.tar.gz" \
            "yam-${ARTIFACT_VERSION}-macos-universal.zip" \
            SHA256SUMS
          gh release edit "$TAG" --draft=false
